name: dashboard

# Rebuilds README.md and the cards in assets/ from status.js (in cv-site) and the GitHub API.
on:
  schedule:
    - cron: "17 */3 * * *"   # every three hours
  workflow_dispatch:          # the "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["build.py", ".github/workflows/dashboard.yml"]

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        run: git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
      - name: Build
        run: python3 build.py
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Refresh dashboard"
            git push
          fi
