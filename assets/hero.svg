<text x="68" y="104" font-size="46" font-weight="800" fill="#F1EEE3" text-anchor="start" letter-spacing="0.5">CEDRIC ANTONY JOSEPH</text>
<text x="68" y="152" font-size="23" font-weight="500" fill="#F1EEE3" text-anchor="start">I build detection engines at three layers of the stack:</text>
<text x="68" y="184" font-size="23" font-weight="500" fill="#F1EEE3" text-anchor="start">kernel, device and ledger.</text>
<text x="68" y="230" font-size="16" font-weight="400" fill="#B7C1BB" text-anchor="start">Computer science undergraduate, VIT Chennai. AI and machine learning, security and systems.</text>
